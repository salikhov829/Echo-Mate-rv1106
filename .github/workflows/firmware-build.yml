name: Firmware Build

on:
  push:
    branches: [ main, setup/github-actions ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2:00 UTC

env:
  RK_JOBS: 4
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install Git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            bc \
            cmake \
            dtc \
            libssl-dev \
            device-tree-compiler \
            python3 \
            python3-dev \
            rsync \
            flex \
            bison \
            u-boot-tools

      - name: Setup build environment
        run: |
          cd SDK/rv1106-sdk
          chmod +x build.sh
          mkdir -p config
          echo "Build environment ready"

      - name: Select board configuration
        run: |
          cd SDK/rv1106-sdk
          echo "7" | timeout 10 ./build.sh lunch || echo "Board selection completed"

      - name: Build firmware
        run: |
          cd SDK/rv1106-sdk
          ./build.sh all 2>&1 | tee build.log
        timeout-minutes: 360
        continue-on-error: true

      - name: Check build output
        run: |
          if [ -d "SDK/rv1106-sdk/output/image" ]; then
            echo "✅ Build artifacts found"
            ls -lah SDK/rv1106-sdk/output/image/
          else
            echo "⚠️ No image output directory"
          fi

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-${{ github.run_number }}
          path: |
            SDK/rv1106-sdk/output/image/
            SDK/rv1106-sdk/build.log
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn

      - name: Upload build directory on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-${{ github.run_number }}
          path: SDK/rv1106-sdk/output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          echo "=== Build Summary ===" 
          echo "Job Status: ${{ job.status }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
