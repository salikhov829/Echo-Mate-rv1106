name: Firmware Build

on:
  push:
    branches: [ main, setup/github-actions ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            curl \
            wget \
            bc \
            cmake \
            device-tree-compiler \
            python3 \
            python3-dev \
            rsync \
            flex \
            bison \
            u-boot-tools \
            libncurses-dev \
            pkg-config

      - name: Check directory structure
        run: |
          echo "=== Repository Structure ==="
          ls -la
          echo ""
          echo "=== SDK Structure ==="
          ls -la SDK/
          echo ""
          echo "=== rv1106-sdk Structure ==="
          ls -la SDK/rv1106-sdk/ || echo "rv1106-sdk not found"

      - name: Make build scripts executable
        run: |
          chmod +x SDK/rv1106-sdk/build.sh
          chmod +x SDK/rv1106-sdk/project/build.sh

      - name: Show available board configs
        run: |
          echo "=== Available BoardConfig files ==="
          find SDK/rv1106-sdk/project/cfg -name "BoardConfig*.mk" -type f 2>/dev/null | sort || echo "No BoardConfig files found"

      - name: Select board configuration (non-interactive)
        run: |
          cd SDK/rv1106-sdk
          BOARD_CONFIG_FILE="project/cfg/BoardConfig_IPC/BoardConfig-SD_CARD-Buildroot-RV1106_Echo_Mate-DeskMate.mk"
          echo "=== Selecting board config: ${BOARD_CONFIG_FILE} ==="
          ln -rfs "${BOARD_CONFIG_FILE}" .BoardConfig.mk
          echo "=== BoardConfig symlink created ==="
          ls -la .BoardConfig.mk
          echo "=== BoardConfig contents ==="
          cat .BoardConfig.mk

      - name: Run full firmware build
        id: build
        run: |
          cd SDK/rv1106-sdk/project
          echo "=== Starting full firmware build (allsave) ==="
          timeout 7200 ./build.sh allsave 2>&1 | tee build.log
          echo "=== Build completed ==="

      - name: Check build output
        if: always()
        run: |
          echo "=== Firmware images in output/image ==="
          if [ -d "SDK/rv1106-sdk/output/image" ]; then
            find SDK/rv1106-sdk/output/image -type f | sort | xargs -I{} ls -lh {}
          else
            echo "❌ output/image directory not found"
          fi

      - name: Upload firmware images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: |
            SDK/rv1106-sdk/output/image/*.img
            SDK/rv1106-sdk/output/image/*.bin
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: SDK/rv1106-sdk/project/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "=== Build Workflow Summary ==="
          echo "Status: ${{ job.status }}"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          if [ -d "SDK/rv1106-sdk/output/image" ]; then
            echo "=== Generated firmware files ==="
            find SDK/rv1106-sdk/output/image -type f -name "*.img" -o -name "*.bin" | sort
          fi
